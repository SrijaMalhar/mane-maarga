name: Mane Maarga CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint and type-check
        working-directory: backend
        run: |
          ruff check app tests benchmarks scripts
          ruff format --check app tests benchmarks scripts
          mypy
      - name: Rule packs (schema, sources, Kannada)
        working-directory: backend
        run: python scripts/rules_lint.py
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run benchmarks
        run: make eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Style lint (no hype, emoji, gradients; Kannada complete)
        working-directory: frontend
        run: npm run lint:style
      - name: Rule packs match the backend
        working-directory: frontend
        run: npm run check:rules
      - name: Build frontend
        working-directory: frontend
        run: npm run build
