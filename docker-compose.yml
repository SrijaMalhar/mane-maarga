services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sooru
      POSTGRES_PASSWORD: sooru_dev
      POSTGRES_DB: sooru
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sooru -d sooru"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sooru:sooru_dev@db:5432/sooru
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data: