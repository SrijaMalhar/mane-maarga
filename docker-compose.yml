services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sooru
      POSTGRES_PASSWORD: sooru_dev
      POSTGRES_DB: sooru
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sooru -d sooru"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sooru:sooru_dev@db:5432/sooru
      SOORU_JWT_SECRET: ${SOORU_JWT_SECRET:-local-development-secret-change-before-deployment}
      SOORU_UPLOAD_DIR: /app/uploads/cases
    ports:
      - "8000:8000"
    volumes:
      - sooru_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  sooru_uploads:
