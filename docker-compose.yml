services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mane_maarga
      POSTGRES_PASSWORD: mane_maarga_dev
      POSTGRES_DB: mane_maarga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mane_maarga -d mane_maarga"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://mane_maarga:mane_maarga_dev@db:5432/mane_maarga
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MANE_MAARGA_JWT_SECRET: ${MANE_MAARGA_JWT_SECRET:-local-development-secret-change-before-deployment}
      MANE_MAARGA_UPLOAD_DIR: /app/uploads/cases
      MANE_MAARGA_LOG_LEVEL: ${MANE_MAARGA_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - mane_maarga_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  mane_maarga_uploads:
