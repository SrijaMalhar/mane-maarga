server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://tile.openstreetmap.org https://upload.wikimedia.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
  location = /health { proxy_pass http://api:8000/health; proxy_set_header Host $host; }
  location = /frontend-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /ready { proxy_pass http://api:8000/ready; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}
