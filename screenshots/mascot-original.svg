<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sooru mascot" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCF7E9"/>
      <stop offset="1" stop-color="#F1E5CA"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F1E3"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="452" rx="150" ry="12" fill="#1F2B4D" opacity="0.10"/>

  <!-- doorstep base -->
  <rect x="148" y="418" width="216" height="26" rx="13" fill="#E3D6B8"/>

  <!-- house body -->
  <rect x="116" y="206" width="280" height="226" rx="48" fill="url(#cream)"/>

  <!-- roof -->
  <polygon points="98,232 256,94 414,232" fill="#1F2B4D" stroke="#1F2B4D" stroke-width="28" stroke-linejoin="round"/>
  <path d="M116 220 L246 108" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- golden eave trim -->
  <path d="M124 238 H388" stroke="#D9B15B" stroke-width="5" stroke-linecap="round"/>

  <!-- sage leaf sprout -->
  <path d="M256 82 V62" stroke="#6F9470" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 66 C232 66 218 48 220 30 C244 30 256 46 256 66 Z" fill="#8FAE8B"/>
  <path d="M256 66 C278 66 292 50 291 34 C270 35 256 48 256 66 Z" fill="#6F9470"/>

  <!-- eyes -->
  <ellipse cx="216" cy="298" rx="13" ry="17" fill="#1F2B4D"/>
  <ellipse cx="296" cy="298" rx="13" ry="17" fill="#1F2B4D"/>
  <circle cx="220" cy="291" r="4.5" fill="#FFFFFF"/>
  <circle cx="300" cy="291" r="4.5" fill="#FFFFFF"/>
  <circle cx="212" cy="305" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="292" cy="305" r="2" fill="#FFFFFF" opacity="0.8"/>

  <!-- cheeks -->
  <ellipse cx="188" cy="326" rx="14" ry="8.5" fill="#F0C4A4" opacity="0.55"/>
  <ellipse cx="324" cy="326" rx="14" ry="8.5" fill="#F0C4A4" opacity="0.55"/>

  <!-- smile -->
  <path d="M238 326 Q256 344 274 326" stroke="#1F2B4D" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- tiny checklist -->
  <g transform="rotate(8 361 396)">
    <rect x="330" y="358" width="62" height="78" rx="12" fill="#1F2B4D" opacity="0.10" transform="translate(2 3)"/>
    <rect x="330" y="358" width="62" height="78" rx="12" fill="url(#paper)"/>
    <rect x="350" y="352" width="22" height="10" rx="5" fill="#D9B15B"/>
    <path d="M341 380 l4.5 4.5 l9 -10" stroke="#6F9470" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M341 400 l4.5 4.5 l9 -10" stroke="#6F9470" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M341 420 l4.5 4.5 l9 -10" stroke="#D9B15B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M362 381 H381 M362 401 H381 M362 421 H376" stroke="#C5CCDB" stroke-width="4" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
